<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Circle at 16, where every edge has to land on a pixel boundary or it
    renders as grey mush. Flat fills, no gradients — a two-stop gradient
    across five pixels is five different greys and no gradient.
  -->
