  <path d="M1 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4H1z" fill="#7c2ac4"/>
  <circle cx="8" cy="8" r="3.5" fill="#fdfdfd"/>
  <g fill="#6f21b5">
    <circle cx="8" cy="7" r="1.3"/>
    <path d="M5.8 10.4a2.2 2.2 0 0 1 4.4 0z"/>
  </g>
</svg>
