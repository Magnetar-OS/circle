name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check, lint, test, and validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The substrate is a path dependency and lives in its own repository, so
      # it has to be checked out beside this one for anything to build. Kept as
      # a sibling directory because that is what Cargo.toml's `../cosmic-pim`
      # resolves to.
      - name: Check out the shared substrate
        uses: actions/checkout@v5
        with:
          repository: Magnetar-OS/cosmic-pim
          path: cosmic-pim-checkout

      - name: Place the substrate where Cargo.toml expects it
        run: mv cosmic-pim-checkout ../cosmic-pim

      # libcosmic pulls in the Wayland, XKB, and OpenSSL stacks.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libssl-dev libsqlite3-dev \
            libudev-dev libinput-dev pkg-config \
            appstream desktop-file-utils

      # No toolchain action on purpose. `rust-toolchain.toml` names the
      # channel and its components, and rustup — preinstalled on the runner —
      # installs both on the first cargo invocation. Passing a toolchain to an
      # action overrides that file, which is how CI silently starts building
      # on something other than the version Cargo.toml declares.

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v3

      # `rust-toolchain.toml` says it is "kept in agreement with rust-version
      # in Cargo.toml". They were not: the channel was `1.98`, which floats to
      # the newest 1.98.x, while the manifest declared 1.98.0 as the minimum.
      # So the version offered as supported was one nothing ever built —
      # every build, local and CI, was on 1.98.1.
      #
      # Cargo cannot report this. `rust-version` is a *minimum*, so a manifest
      # demanding more than the pinned channel is refused outright while one
      # demanding less builds in silence — measured here in both directions,
      # not recalled. The silent direction is the one a routine toolchain bump
      # produces, so it is the one that needs a gate.
      #
      # Both are pinned to an exact patch now, so the declared minimum is the
      # version actually built and this comparison can be equality.
      - name: Toolchain and manifest agree
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          manifest=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          test -n "$manifest" || { echo "no rust-version in Cargo.toml"; exit 1; }
          if [ "$channel" != "$manifest" ]; then
            echo "rust-toolchain.toml pins $channel; Cargo.toml declares $manifest."
            echo "Raise both together — cargo will not tell you when the manifest"
            echo "is the lower of the two."
            exit 1
          fi
          echo "both at $channel"

      - name: Formatting
        run: just fmt-check

      - name: Clippy
        run: just check

      - name: Tests
        run: just test

      # Runs last because the desktop entry and metainfo are build outputs, so
      # this needs a completed build to have anything to validate.
      - name: Validate desktop entry and AppStream metadata
        run: just validate-metadata
