[package]
name = "circle"
version = "0.1.0"
edition = "2024"
# GPL-3.0-only for the application; the shared substrate (cosmic-pim) is
# MPL-2.0 and is linked, not absorbed. See LICENSING.md.
license = "GPL-3.0-only"
description = "Circle — contacts for the COSMIC desktop"
repository = "https://github.com/entro314-labs/circle"
rust-version = "1.98.0"

[build-dependencies]
# Generates the desktop entry and AppStream metainfo from `resources/*` plus the
# Fluent catalogues, so the app's name and summary are translated in the
# applications menu and the software centre too. See build.rs.
xdgen = "0.1"

[dependencies]
# --- the shared PIM substrate (MPL-2.0) ---
# Paths until cosmic-pim is pushed; then git tags, with a commented [patch]
# below for local work. See slate/Cargo.toml for the same note in full.
cosmic-pim-core = { path = "../cosmic-pim/crates/cosmic-pim-core" }
cosmic-pim-accounts = { path = "../cosmic-pim/crates/cosmic-pim-accounts" }
cosmic-pim-sync = { path = "../cosmic-pim/crates/cosmic-pim-sync" }

# --- COSMIC / UI ---
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"
open = "5.4"
tokio = { version = "1.53", features = ["full"] }

chrono = { version = "0.4.45", features = ["clock", "serde"] }
# Center-crops and downscales a chosen photo before it is embedded in the card:
# a camera photo pasted verbatim makes a 10 MB vCard that some servers reject.
# Already in the dependency graph through libcosmic, so this costs no new build.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
# The single-instance hand-over serialises its request as JSON (Slate does the
# same), the pop-launcher plugin speaks newline-delimited JSON on stdio, and
# the link store's records are JSON files under `.links/`.
serde_json = "1"
# Ids for link records. Already in the graph through cosmic-pim-core.
uuid = { version = "1", features = ["v4"] }
# Duplicate review: transliteration-aware name similarity (Γιώργος ↔ George),
# suggestions only — matches never auto-merge anything (03 §6).
any_ascii = "0.3"
strsim = "0.11"
# Sharing a contact as a QR code. Default features off: the bundled image and
# SVG renderers pull their own dependencies, and the matrix is all this needs
# — the SVG is twenty lines and keeps the payload under our own control.
qrcode = { version = "0.14", default-features = false }
# KDE Connect handoff: asking the daemon which phone is reachable, and handing
# it a number to dial or text. Already in the tree through libcosmic, and used
# directly here for the same reason Slate does — the alternative is shelling
# out to a CLI that may not be installed alongside the daemon.
zbus = "5.19"
# CSV import. RFC 4180 quoting — embedded commas, quotes, and newlines — is
# exactly the kind of parser that looks trivial and is not; the boring crate
# is the right answer.
csv = "1.4"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open;
    # also what carries `circle --new-contact` and `.vcf` paths to it.
    "single-instance",
    # GPU-accelerated rendering
    "wgpu",
    # Native file dialogs, for .vcf import and export
    "xdg-portal",
    # `spawn_desktop_exec` with a systemd transient scope, so a window the
    # launcher plugin opens belongs to the session rather than to pop-launcher.
    "desktop-systemd-scope",
]

[dev-dependencies]
# The write-path tests read the push queue back to prove a queued save carries
# its pre-edit base — the queue lives behind caldav's VdirStore.
cosmic-pim-caldav = { path = "../cosmic-pim/crates/cosmic-pim-caldav" }
# Integration tests write real address books to a scratch directory rather than
# mocking the store: the thing under test is that bytes survive a round trip
# through the filesystem, which a mock cannot demonstrate.
tempfile = "3"

[[bin]]
name = "circle"
path = "src/main.rs"

[[bin]]
# pop-launcher plugin: searching contacts from the COSMIC launcher.
name = "circle-launcher"
path = "src/bin/launcher.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
