# Flatpak manifest.
#
# Two things make this less ordinary than it looks:
#
#   * cosmic-pim is a sibling path dependency, not a crates.io release, so it
#     is a second source checked out beside this one — the same arrangement the
#     README describes for a local build.
#   * The build is offline, so `just vendor` output has to exist. The
#     cargo-sources.json referenced below is generated by
#     flatpak-cargo-generator.py from Cargo.lock; regenerate it whenever the
#     lockfile changes or the build will fail resolving a crate.
#
# Filesystem access is deliberately narrow: the address books, the suite's
# shared config, and nothing else. Import and export go through the file
# portal, so no blanket home access is needed for them.
app-id: io.github.entro314labs.Circle
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: circle

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # CardDAV sync, and nothing else — no network for contact photos, by design.
  - --share=network
  # GPU access for wgpu.
  - --device=dri
  # Passwords, via the OS keyring.
  - --talk-name=org.freedesktop.secrets
  # Single-instance activation claims the app id on the session bus.
  - --own-name=io.github.entro314labs.Circle
  # The address books and the suite's shared accounts file.
  - --filesystem=xdg-data/contacts:create
  - --filesystem=xdg-config/cosmic-pim:create
  # cosmic-config, shared with the rest of the desktop.
  - --filesystem=xdg-config/cosmic:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/circle/cargo

modules:
  - name: circle
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm0755 target/release/circle /app/bin/circle
      - install -Dm0755 target/release/circle-launcher /app/bin/circle-launcher
      - install -Dm0644 target/xdgen/app.desktop
        /app/share/applications/io.github.entro314labs.Circle.desktop
      - install -Dm0644 target/xdgen/app.metainfo.xml
        /app/share/metainfo/io.github.entro314labs.Circle.metainfo.xml
      - install -Dm0644 resources/icons/hicolor/scalable/apps/icon.svg
        /app/share/icons/hicolor/scalable/apps/io.github.entro314labs.Circle.svg
      # One SVG per size, as the justfile installs them.
      - for size in 16 24 32 48 64; do install -Dm0644
        "resources/icons/hicolor/$size/apps/icon.svg"
        "/app/share/icons/hicolor/$size/apps/io.github.entro314labs.Circle.svg"; done
    sources:
      - type: dir
        path: ../..
      # The substrate, beside this checkout, exactly as Cargo.toml's
      # `../cosmic-pim` path expects.
      - type: git
        url: https://github.com/Magnetar-OS/cosmic-pim.git
        branch: main
        dest: ../cosmic-pim
      - cargo-sources.json
